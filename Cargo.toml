[package]
name = "maestro"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Ivan Cernja"]
description = "Run parallel coding agents in isolated git worktrees, from one terminal app"
repository = "https://github.com/ivancernja/maestro"
homepage = "https://github.com/ivancernja/maestro"
license = "MIT"
readme = "README.md"
keywords = ["tui", "agents", "git", "worktree", "tmux"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["docs/*.png", "test/*"]

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
portable-pty = "0.9.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tui-term = "0.3.4"
vt100 = "0.16.2"

[profile.release]
strip = true
